<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="drum-machine">
        <div id="pad-bank">
            <button class="drumpad" id="heater1">Q
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" id="Q"></audio>
            </button>

            <button class="drumpad" id="heater2">W
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" id="W"></audio>
            </button>

            <button class="drumpad" id="heater3">E
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" id="E"></audio>
            </button>

            <button class="drumpad" id="heater4">A
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" id="A"></audio>
            </button>

            <button class="drumpad" id="clap">S
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" id="S"></audio>
            </button>

            <button class="drumpad" id="open-HH">D
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" id="D"></audio>
            </button>

            <button class="drumpad" id="Kick_n_Hat">Z
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" id="Z"></audio>
            </button>

            <button class="drumpad" id="kick">X
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" id="X"></audio>
            </button>

            <button class="drumpad" id="closed_hh">C
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" id="C"></audio>
            </button>
        </div>
        <p id="display"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
